[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "megb"
version = "0.1.0"
description = "Measurement Engineering Gaming Benchmark"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.mypy]
# The project supports Python 3.10+ (see requires-python); this is pinned
# higher so mypy can parse newer syntax appearing in third-party stubs
# (e.g. numpy, pulled in transitively via pytest's optional numpy
# integration) without rejecting them at the parser level. It does not
# license using 3.11+/3.12+-only syntax in this project's own code.
python_version = "3.12"
strict = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["human_eval.*", "evalplus.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pylint.main]
py-version = "3.10"

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
# Kept narrow and project-wide only for patterns that recur systematically
# across this codebase's architecture, not as a blanket way to silence the
# new implementation. Anything triggered by one or two specific functions
# is suppressed locally at the call site instead (see inline
# `# pylint: disable=...` comments in src/execution/).
disable = [
    # Every measurement-system/optimizer/execution-backend interface in this
    # project (BaseMeasurementSystem, BaseOptimizer, ExecutionBackend) is a
    # single-abstract-method ABC by design: the one method *is* the whole
    # interface, not a smell.
    "too-few-public-methods",
    # Most "large" classes here are frozen dataclasses that exist purely to
    # carry a research-data schema (CandidateExecutionRequest/Result,
    # DatasetProvenance, PrivilegedTaskView) — many fields because they are
    # records, not because they hold excessive behavior/state.
    "too-many-instance-attributes",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires network access to fetch pinned upstream datasets",
    "docker: requires a running Docker daemon and the megb-runner:local image",
]
